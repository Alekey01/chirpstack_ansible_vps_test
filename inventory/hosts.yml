# Inventario: la lista de máquinas que Ansible va a gestionar.
#
# Ahora Ansible se ejecuta DESDE la Mac y se conecta por SSH al VPS remoto.
# La contraseña SSH NO se guarda aquí; Ansible la pedirá al arrancar gracias
# a `ask_pass = True` en ansible.cfg.

all:
  children:
    chirpstack_servers:
      hosts:
        chirpstack-vps:
          ansible_host: 217.71.200.37
          ansible_user: root
          ansible_port: 22
          ansible_connection: ssh
          
