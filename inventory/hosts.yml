# Inventario: la lista de máquinas que Ansible va a gestionar.
#
# Estado actual: Ansible se ejecuta DENTRO de la propia VPS y se aplica a sí misma.
# Por eso usamos `ansible_connection: local` — no hay SSH entre dos máquinas, la
# conexión es interna al propio host.
#
# Más adelante, para el equipo del cliente, este fichero se modificará para apuntar
# por SSH al equipo del cliente (con ansible_host, ansible_user, etc.).

all:
  children:
    chirpstack_servers:
      hosts:
        chirpstack-local:
          ansible_connection: local
