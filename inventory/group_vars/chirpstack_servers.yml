---
# Variables compartidas por TODOS los hosts del grupo `chirpstack_servers`.
# Ansible las inyecta automáticamente en cualquier tarea/plantilla que las use.
#
# UBICACIÓN: este fichero vive junto al inventario (inventory/group_vars/) porque
# así Ansible lo carga automáticamente. Si se pone en la raíz del proyecto, NO
# se carga cuando el inventario está en una subcarpeta — ese fue un bug real
# que nos costó un fallo en producción del rol gateway_bridge.
#
# Las variables específicas de cada componente viven en `roles/<rol>/defaults/main.yml`.
#
# Buenas prácticas:
# - Pon aquí lo que cambiarías al pasar del entorno de pruebas (VPS) al equipo del cliente.
# - NO pongas contraseñas en claro: cuando llegue el momento usaremos `ansible-vault`.

# ─── Identidad del despliegue ─────────────────────────────────────────────────
proyecto_nombre: chirpstack-iot
entorno: pruebas             # pruebas | cliente

# ─── Red ──────────────────────────────────────────────────────────────────────
# Puerto en el que la UI web de ChirpStack escucha (interno).
chirpstack_puerto_web: 8080

# Dirección donde ChirpStack hace bind. Con nginx delante usamos 127.0.0.1
# (solo accesible localmente) y dejamos que nginx en :80 sea la única puerta
# de entrada desde internet.
chirpstack_bind_address: "127.0.0.1"

# ─── Versiones (rellenar cuando confirmemos compatibilidad con la VPS) ────────
# chirpstack_version: "4.x"
# postgresql_version: "16"

# ─── Repositorio apt oficial de ChirpStack ────────────────────────────────────
# Compartido entre los roles `chirpstack_gateway_bridge` y `chirpstack`.
# Lo definimos aquí (en group_vars) para no duplicarlo en cada rol.
chirpstack_apt_key_url: "https://artifacts.chirpstack.io/packages/chirpstack.key"
chirpstack_apt_keyring: "/etc/apt/keyrings/chirpstack.gpg"
chirpstack_apt_repo_url: "https://artifacts.chirpstack.io/packages/4.x/deb"
chirpstack_apt_repo_components: "stable main"

# ─── Configuración del servidor ChirpStack ────────────────────────────────────
# Región LoRaWAN activa. Lista oficial (sub-bandas para US915):
#   eu868     → Europa (España, lo "correcto" si el gateway es europeo)
#   us915_0   → EEUU sub-band 1 (canales 0-7)   ← lo más común
#   us915_1   → EEUU sub-band 2 (canales 8-15)
#   ...       hasta us915_7
#   as923     → Asia
#   au915     → Australia
#
# Hay que ENCAJAR la región con la del gateway físico. Si no, no se entienden.
# Actualmente apuntamos a us915_1 (Sub-band 2) porque el gateway de pruebas
# Milesight UG63-L08GL-915M es hardware US915 configurado con Sub-band 2.
# Cuando llegue un gateway europeo, volver a "eu868".
chirpstack_region: "us915_1"

# Secreto que ChirpStack usa para firmar JWTs/sessions de la API.
# 🔒 PROVISIONAL: cuando todo funcione, generaremos uno random con
# `openssl rand -base64 32` y lo moveremos a ansible-vault.
chirpstack_api_secret: "cambia_este_secreto_chirpstack_temporal"
