---
# Playbook MAESTRO: orquesta el despliegue completo de ChirpStack.
#
# Ejecutar (desde la raíz del proyecto, en la VPS):
#   ansible-playbook playbooks/site.yml
#
# Para ejecutar solo una parte usa --tags. Ejemplos:
#   ansible-playbook playbooks/site.yml --tags base
#   ansible-playbook playbooks/site.yml --tags redis,postgresql
#
# El ORDEN de los roles importa: ChirpStack necesita Postgres, Redis y Mosquitto
# funcionando antes de arrancar.

- name: Desplegar stack ChirpStack
  hosts: chirpstack_servers
  gather_facts: true        # recopila datos del SO (versión Ubuntu, etc.) — los roles los usan
  roles:
    - role: base
      tags: [base]

    - role: postgresql
      tags: [postgresql, db]

    - role: redis
      tags: [redis, cache]

    - role: mosquitto
      tags: [mosquitto, mqtt]

    - role: chirpstack_gateway_bridge
      tags: [gateway_bridge, chirpstack]

    - role: chirpstack
      tags: [chirpstack, app]

    # Proxy REST → gRPC. Necesario para que los roles siguientes hablen JSON
    # con la API de ChirpStack (el binario chirpstack solo expone gRPC).
    - role: chirpstack_rest_api
      tags: [chirpstack_rest_api, rest_api, gateways]

    # API key admin (idempotente: lee /etc/chirpstack/.ansible_api_key si existe).
    - role: chirpstack_api_key
      tags: [chirpstack_api_key, api_key, gateways]

    # Alta de gateways en ChirpStack desde inventory/group_vars/.../gateways.yml.
    - role: chirpstack_gateway
      tags: [chirpstack_gateway, gateways]

    - role: dashboard
      tags: [dashboard]

    - role: nginx
      tags: [nginx, proxy]

    - role: firewall
      tags: [firewall]
