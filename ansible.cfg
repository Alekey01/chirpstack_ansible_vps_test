# Configuración de Ansible para el proyecto ChirpStack.
# Ansible lee este archivo automáticamente cuando ejecutas comandos
# desde esta carpeta.

[defaults]
# Dónde está la lista de servidores a gestionar.
inventory = inventory/hosts.yml

# Carpeta donde Ansible busca los roles.
roles_path = roles

# Evita el aviso de "fingerprint" de SSH la primera vez (cómodo en laboratorio).
host_key_checking = False

# Deja que Ansible detecte solo el Python del servidor remoto.
interpreter_python = auto_silent

# Pedir la contraseña SSH al arrancar (no se guarda en disco).
ask_pass = True

# Lee la passphrase de ansible-vault de un fichero local con permisos 600.
# Crearlo (UNA VEZ) con:
#   echo 'tu-passphrase' > ~/.ansible_vault_pass && chmod 600 ~/.ansible_vault_pass
# Si prefieres que te la pida cada vez, comenta esta línea y pasa --ask-vault-pass.
vault_password_file = ~/.ansible_vault_pass

[privilege_escalation]
# Como nos conectamos como root, NO hace falta sudo: become desactivado.
# Si en el futuro cambiamos a un usuario no-root, poner become = True y
# ask_become_pass = True (o usar llaves + NOPASSWD).
become = False
