---
# Rol `redis`: caché en memoria usada por ChirpStack para sesiones, contadores
# y colas internas.
#
# Tras este rol tendremos:
#   - Redis instalado y corriendo
#   - Escuchando solo en localhost (default de Ubuntu, lo verificamos)

# ─── 1. Paquete ───────────────────────────────────────────────────────────────
- name: "[redis] Instalar redis-server"
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true
    cache_valid_time: 3600

# ─── 2. Servicio ──────────────────────────────────────────────────────────────
- name: "[redis] Asegurar que el servicio está activo y habilitado"
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true

# ─── 3. Comprobación: NO expuesto a internet ──────────────────────────────────
# Si por error se pone `bind 0.0.0.0` en redis.conf sin autenticación, cualquiera
# en internet puede borrar la BD. Aquí verificamos que Redis solo escucha en
# localhost (IPv4 127.0.0.1 e IPv6 ::1, ambos son loopback y son aceptables).
#
# `ss -tlnH` lista sockets TCP en escucha, sin cabecera. La columna 4 es la
# "Local Address:Port" — la única que importa para saber dónde escucha.
# La 5ª columna ("Peer Address") siempre es 0.0.0.0:* para LISTEN: NO es
# la dirección de escucha, es el filtro de qué clientes acepta. Por eso un
# `grep '0.0.0.0'` ingenuo da falsos positivos.

- name: "[redis] Obtener direcciones donde escucha Redis"
  ansible.builtin.shell:
    cmd: "ss -tlnH | awk '{print $4}' | grep ':{{ redis_port }}$' || true"
  register: redis_listen
  changed_when: false

- name: "[redis] Mostrar direcciones de escucha (informativo)"
  ansible.builtin.debug:
    msg: "Redis escucha en: {{ redis_listen.stdout_lines }}"

# Permitimos 127.0.0.1 (IPv4 loopback) y [::1] (IPv6 loopback). Cualquier otra
# dirección hace fallar el playbook con un mensaje claro.
- name: "[redis] Fallar si Redis está expuesto fuera de localhost"
  ansible.builtin.fail:
    msg: >-
      Redis está escuchando en "{{ item }}" — fuera de localhost.
      Revisa /etc/redis/redis.conf parámetro `bind` y reinicia el servicio.
  loop: "{{ redis_listen.stdout_lines }}"
  when:
    - not (item is match('^127\.0\.0\.1:'))
    - not (item is match('^\[::1\]:'))
