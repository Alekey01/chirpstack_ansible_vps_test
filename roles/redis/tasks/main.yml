---
# Rol `redis`: caché en memoria usada por ChirpStack para sesiones, contadores
# y colas internas.
#
# Tras este rol tendremos:
#   - Redis instalado y corriendo
#   - Escuchando solo en localhost (default de Ubuntu, lo verificamos)

# ─── 1. Paquete ───────────────────────────────────────────────────────────────
- name: "[redis] Instalar redis-server"
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true
    cache_valid_time: 3600

# ─── 2. Servicio ──────────────────────────────────────────────────────────────
- name: "[redis] Asegurar que el servicio está activo y habilitado"
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true

# ─── 3. Comprobación: NO expuesto a internet ──────────────────────────────────
# Verificamos que Redis está escuchando solo en 127.0.0.1. Si alguna vez se
# cambia `bind` a 0.0.0.0 sin autenticación, cualquiera puede borrar la BD.
# Usamos `ss` (sustituto moderno de netstat) para inspeccionar.
- name: "[redis] Verificar que Redis solo escucha en {{ redis_bind }}"
  ansible.builtin.shell: "ss -tlnp | grep ':{{ redis_port }} ' || true"
  register: redis_listen
  changed_when: false

- name: "[redis] Mostrar puertos donde escucha Redis (informativo)"
  ansible.builtin.debug:
    var: redis_listen.stdout_lines

- name: "[redis] Avisar si Redis escucha fuera de localhost"
  ansible.builtin.fail:
    msg: >-
      Redis está escuchando en una IP distinta a {{ redis_bind }}.
      Salida de ss: {{ redis_listen.stdout }}
      Revisa /etc/redis/redis.conf y el parámetro `bind`.
  when: redis_listen.stdout is search('0.0.0.0') or redis_listen.stdout is search('::')
