---
# Rol `chirpstack_gateway`: da de alta gateways en ChirpStack vía REST API.
#
# Flujo:
#   1. Resolver tenant_id a partir del nombre (defecto "ChirpStack").
#   2. Por cada gateway de `chirpstack_gateways`:
#        - GET /api/gateways/{eui}
#            · 200 → existe, no hacemos nada (idempotente)
#            · 404 → POST /api/gateways para crearlo
#
# El packet forwarder del gateway físico (Milesight UG63 → UDP a :1700) se
# configura aparte; este rol SOLO registra el gateway en ChirpStack para que
# aparezca en la UI y los uplinks sean aceptados.
#
# En `--check`: TODAS las llamadas API se saltan (no hay token simulable, los
# POST no se ejecutan). El rol queda como "skipped" y los siguientes roles
# (dashboard, nginx, firewall) corren normalmente.

# ─── 0. Sanity check ──────────────────────────────────────────────────────────
- name: "[gateways] Validar que hay gateways definidos"
  ansible.builtin.assert:
    that:
      - chirpstack_gateways is iterable
    fail_msg: "chirpstack_gateways no está definida. Rellénala en inventory/group_vars/chirpstack_servers/gateways.yml"
    quiet: true

# OJO: aquí NO se usa `meta: end_play` para saltar el rol con lista vacía.
# end_play termina el PLAY entero — en site.yml se habría llevado por delante
# dashboard, nginx y firewall sin ningún error. El salto se hace con la
# condición `chirpstack_gateways | length > 0` en el bloque de abajo.

# ─── 1-3. Bloque con las llamadas API ─────────────────────────────────────────
# El `when` del bloque se hereda a todas las tareas internas: si estamos en
# --check, no hay token o la lista está vacía, no se ejecuta nada del block.
- name: "[gateways] Operaciones contra la API de ChirpStack"
  when:
    - not ansible_check_mode
    - chirpstack_api_token is defined
    - chirpstack_api_token | length > 0
    - chirpstack_gateways | length > 0
  block:
    # ── 1. Resolver tenant_id por nombre ────────────────────────────────────
    # ChirpStack devuelve { totalCount, result: [{id, name, ...}] }.
    - name: "[gateways] Listar tenants en ChirpStack"
      ansible.builtin.uri:
        url: "{{ chirpstack_api_base }}/api/tenants?limit=100"
        headers:
          Grpc-Metadata-Authorization: "Bearer {{ chirpstack_api_token }}"
        status_code: 200
      register: chirpstack_tenants_list
      no_log: true

    # Primero filtramos a una lista y comprobamos que NO está vacía. Si se hace
    # `| first` directamente sobre una lista vacía, Jinja revienta con un error
    # críptico antes de que ningún failed_when pueda dar un mensaje útil.
    - name: "[gateways] Buscar el tenant por nombre"
      ansible.builtin.set_fact:
        chirpstack_tenant_matches: >-
          {{
            chirpstack_tenants_list.json.result
            | selectattr('name', 'equalto', chirpstack_default_tenant)
            | list
          }}

    - name: "[gateways] Fallar con mensaje claro si el tenant no existe"
      ansible.builtin.fail:
        msg: >-
          No existe ningún tenant llamado "{{ chirpstack_default_tenant }}" en ChirpStack.
          Tenants disponibles: {{ chirpstack_tenants_list.json.result | map(attribute='name') | list | join(', ') }}.
          Ajusta `chirpstack_default_tenant` (roles/chirpstack_gateway/defaults/main.yml o group_vars).
      when: chirpstack_tenant_matches | length == 0

    - name: "[gateways] Extraer el tenant_id"
      ansible.builtin.set_fact:
        chirpstack_tenant_id: "{{ (chirpstack_tenant_matches | first).id }}"

    - name: "[gateways] Mostrar tenant_id resuelto"
      ansible.builtin.debug:
        msg: "Tenant '{{ chirpstack_default_tenant }}' → {{ chirpstack_tenant_id }}"

    # ── 2. Ver qué gateways ya existen (GET 404 = no existe) ────────────────
    - name: "[gateways] Comprobar existencia de cada gateway"
      ansible.builtin.uri:
        url: "{{ chirpstack_api_base }}/api/gateways/{{ item.gateway_id }}"
        headers:
          Grpc-Metadata-Authorization: "Bearer {{ chirpstack_api_token }}"
        status_code: [200, 404]
      register: chirpstack_gateway_lookup
      loop: "{{ chirpstack_gateways }}"
      loop_control:
        label: "{{ item.gateway_id }} ({{ item.name }})"
      no_log: true

    # ── 3. Crear los que faltan ─────────────────────────────────────────────
    - name: "[gateways] Crear gateways que no existen"
      ansible.builtin.uri:
        url: "{{ chirpstack_api_base }}/api/gateways"
        method: POST
        headers:
          Grpc-Metadata-Authorization: "Bearer {{ chirpstack_api_token }}"
        body_format: json
        body:
          gateway:
            gatewayId: "{{ item.item.gateway_id }}"
            name: "{{ item.item.name }}"
            description: "{{ item.item.description | default('') }}"
            tenantId: "{{ chirpstack_tenant_id }}"
            statsInterval: "{{ item.item.stats_interval | default(30) }}"
            location: "{{ item.item.location | default({}) }}"
            tags: "{{ item.item.tags | default({}) }}"
            metadata: {}
        status_code: 200
      loop: "{{ chirpstack_gateway_lookup.results }}"
      loop_control:
        label: "{{ item.item.gateway_id }} ({{ item.item.name }})"
      when: item.status == 404
      no_log: true

    # ── 4. Resumen ──────────────────────────────────────────────────────────
    - name: "[gateways] Resumen"
      ansible.builtin.debug:
        msg: >-
          Total {{ chirpstack_gateways | length }} gateways en inventario;
          ya existían {{ chirpstack_gateway_lookup.results
                         | selectattr('status', 'equalto', 200) | list | length }},
          creados ahora {{ chirpstack_gateway_lookup.results
                         | selectattr('status', 'equalto', 404) | list | length }}.

- name: "[gateways] Aviso si el rol se saltó"
  ansible.builtin.debug:
    msg: >-
      Rol chirpstack_gateway saltado:
      {{ 'check mode activo' if ansible_check_mode
         else ('no hay gateways en chirpstack_gateways' if chirpstack_gateways | length == 0
         else 'no hay API token disponible') }}.
  when: >-
    ansible_check_mode
    or chirpstack_api_token is not defined
    or (chirpstack_api_token | length == 0)
    or (chirpstack_gateways | length == 0)
