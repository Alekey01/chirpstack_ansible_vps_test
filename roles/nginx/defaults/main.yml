---
# Variables por defecto del rol `nginx` (reverse proxy delante de ChirpStack).

# Puerto público donde escucha nginx (el que ve internet).
nginx_listen_port: 80

# Hostname que sirve. `_` = wildcard (acepta cualquier Host).
# Cuando tengas un dominio, cámbialo a "chirpstack.tudominio.com".
nginx_server_name: "_"

# A dónde pasa las peticiones nginx por dentro. Construido a partir de las
# variables del rol chirpstack (que viven en group_vars).
nginx_proxy_target: "http://{{ chirpstack_bind_address }}:{{ chirpstack_puerto_web }}"
