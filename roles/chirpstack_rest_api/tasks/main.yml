---
# Rol `chirpstack_rest_api`: proxy REST → gRPC para ChirpStack.
#
# El binario `chirpstack` solo expone gRPC/gRPC-Web (la UI lo usa con protobuf
# binario). Para que Ansible pueda llamar a la API con `uri` (JSON sobre HTTP)
# instalamos `chirpstack-rest-api`, que es el grpc-gateway oficial.
#
# Tras este rol tendremos:
#   - Paquete `chirpstack-rest-api` instalado (del MISMO repo apt que chirpstack)
#   - Override de systemd con las flags --bind --server --insecure
#   - Servicio activo en 127.0.0.1:8090
#   - Verificación: POST /api/internal/login devuelve algo (401 sin creds, OK con).

# ─── 1. Paquete ──────────────────────────────────────────────────────────────
# El repo apt y la clave GPG ya están configurados por roles previos
# (chirpstack_gateway_bridge, chirpstack). No hace falta re-configurarlos.
- name: "[rest-api] Instalar chirpstack-rest-api"
  ansible.builtin.apt:
    name: chirpstack-rest-api
    state: present
    update_cache: true
    cache_valid_time: 3600

# ─── 2. Configurar la unit de systemd ────────────────────────────────────────
# El paquete trae /lib/systemd/system/chirpstack-rest-api.service con valores
# por defecto. En vez de editarlo (lo perderíamos en el siguiente upgrade del
# paquete), usamos un "drop-in" en /etc/systemd/system/<unit>.service.d/
# que sobreescribe SOLO el ExecStart.
- name: "[rest-api] Crear directorio para drop-in"
  ansible.builtin.file:
    path: /etc/systemd/system/chirpstack-rest-api.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[rest-api] Desplegar drop-in con las flags correctas"
  ansible.builtin.copy:
    dest: /etc/systemd/system/chirpstack-rest-api.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      # Vaciamos el ExecStart anterior y lo redefinimos:
      ExecStart=
      ExecStart=/usr/bin/chirpstack-rest-api --bind {{ chirpstack_rest_api_bind }} --server {{ chirpstack_rest_api_upstream }}{{ ' --insecure' if chirpstack_rest_api_insecure else '' }}
  notify: Reiniciar chirpstack-rest-api

# ─── 3. Servicio ─────────────────────────────────────────────────────────────
- name: "[rest-api] Asegurar que el servicio está activo y habilitado"
  ansible.builtin.systemd:
    name: chirpstack-rest-api
    state: started
    enabled: true
    daemon_reload: true

# Forzamos handlers AHORA para que el servicio quede con las flags correctas
# antes de verificar el puerto.
- name: "[rest-api] Ejecutar handlers pendientes antes de verificar"
  ansible.builtin.meta: flush_handlers

# ─── 4. Verificación ─────────────────────────────────────────────────────────
- name: "[rest-api] Esperar a que el proxy REST escuche en {{ chirpstack_rest_api_bind }}"
  ansible.builtin.wait_for:
    host: "{{ chirpstack_rest_api_bind.split(':')[0] }}"
    port: "{{ chirpstack_rest_api_bind.split(':')[1] | int }}"
    timeout: 30
    state: started
