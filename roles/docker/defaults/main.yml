---
# Variables del rol Docker. Sobreescribibles desde group_vars si hace falta.

docker_apt_key_url: "https://download.docker.com/linux/ubuntu/gpg"
docker_apt_keyring: "/etc/apt/keyrings/docker.gpg"
docker_apt_repo_url: "https://download.docker.com/linux/ubuntu"

# Paquetes oficiales del repo de Docker.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
