---
# Variables por defecto del rol `mosquitto`.
#
# Antes hacía bind a 0.0.0.0 para que los contenedores Docker del dashboard
# pudieran llegar vía host.docker.internal. Ahora todos los clientes
# (gateway-bridge, chirpstack server, dashboard backend) viven en el mismo
# host como procesos baremetal, así que basta con loopback.

mosquitto_listener_port: 1883
mosquitto_bind_address: "127.0.0.1"

# `allow_anonymous: true` es aceptable porque el listener solo escucha en
# loopback — no es accesible desde fuera del host. Si en el futuro cambias
# bind a 0.0.0.0 (p.ej. para clientes externos), pon esto a `false` y
# configura usuarios con `password_file`.
mosquitto_allow_anonymous: true
