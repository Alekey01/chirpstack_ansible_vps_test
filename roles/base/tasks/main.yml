---
# Rol `base`: preparación común del sistema.
# Se ejecuta el PRIMERO en site.yml. Sin esto, los demás roles podrían fallar
# al intentar añadir repos o descargar dependencias.
#
# NOTA sobre `ansible_facts`: Ansible recopila información del sistema (distro,
# versión, IPs, hostname…) en el diccionario `ansible_facts`. Históricamente esos
# datos también estaban disponibles como variables sueltas (`ansible_distribution`),
# pero ese atajo está deprecado. Usamos siempre `ansible_facts['xxx']`.

# ─── 1. Salvaguarda: confirmar que estamos en Ubuntu ──────────────────────────
# Destino soportado: Ubuntu — tanto Server como Desktop (probado en 24.04 y
# 26.04, 64-bit). Ambas ediciones reportan distribution == "Ubuntu", así que el mismo
# check vale para las dos. No pinamos la versión a propósito (22.04, 24.04, ...
# son válidas) para no romper si se reinstala el VPS con otra release.
#
# macOS NO está soportado como destino: los roles usan apt/systemd/timedatectl
# (solo Linux) y ChirpStack no publica paquete para macOS. La Mac es únicamente
# el nodo de control desde el que se LANZA ansible, y este check no corre sobre ella.
- name: "[base] Comprobar que la distro es Ubuntu (Server o Desktop)"
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
    fail_msg: >-
      Este playbook solo soporta Ubuntu (Server o Desktop, p.ej. 24.04 64-bit).
      Distro detectada: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    success_msg: >-
      Distro válida: Ubuntu {{ ansible_facts['distribution_version'] }}
      ({{ ansible_facts['distribution_release'] }}).

# ─── 2. Refrescar el índice de paquetes apt ───────────────────────────────────
# `cache_valid_time: 3600` evita repetir el `apt update` si ya se hizo en la
# última hora — acelera reejecuciones del playbook.
- name: "[base] Actualizar índice de paquetes apt"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# ─── 3. Instalar utilidades base ──────────────────────────────────────────────
# Estos paquetes los necesitan los roles siguientes (sobre todo `chirpstack`
# para añadir el repo apt oficial con su clave GPG).
- name: "[base] Instalar utilidades base ({{ base_packages | join(', ') }})"
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

# ─── 4. Asegurar la zona horaria ──────────────────────────────────────────────
# Importante para que los logs y los timestamps de ChirpStack tengan sentido.
# Si la TZ actual ya coincide, la segunda tarea se salta (skipping).
- name: "[base] Comprobar zona horaria actual"
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: tz_actual
  changed_when: false

- name: "[base] Establecer zona horaria a {{ base_timezone }}"
  ansible.builtin.command: "timedatectl set-timezone {{ base_timezone }}"
  when: tz_actual.stdout != base_timezone
  changed_when: true
